<text x="70" y="129" font-size="15.5" fill="#1c1d22" font-weight="700">Pick Sanctum over Passport</text>
<rect x="70" y="140" width="81" height="20" rx="6" fill="#e7e9fb"/>
<text x="110" y="154" font-size="11" fill="#3b40b8" text-anchor="middle" font-weight="700" letter-spacing="0.4">DECISION</text>
<text x="70" y="178" font-size="13.5" fill="#6b6e78">Simpler token model — no OAuth server to run.</text>
<line x1="290.0" y1="202" x2="290.0" y2="220" stroke="#aab0bb" stroke-width="2"/>
<path d="M285.0 215 L295.0 215 L290.0 222 Z" fill="#aab0bb"/>
<rect x="50" y="224" width="480" height="194" rx="9" fill="#ffffff" stroke="#d7d9e0" filter="url(#cardsh)"/>
<text x="70" y="255" font-size="15.5" fill="#1c1d22" font-weight="700">AUTH-12 — Google OAuth callback</text>
<rect x="70" y="266" width="50" height="20" rx="6" fill="#e2f6ea"/>
<text x="95" y="280" font-size="11" fill="#1f8a4c" text-anchor="middle" font-weight="700" letter-spacing="0.4">DONE</text>
<text x="70" y="304" font-size="13.5" fill="#6b6e78">Validate id_token, then link the local user.</text>
<rect x="70" y="320" width="440" height="82" rx="6" fill="#f5f6f8" stroke="#e4e6eb"/>
<text x="84" y="338" font-size="12.5" fill="#5a5d66" font-family="ui-monospace, 'DejaVu Sans Mono', 'Cascadia Code', Menlo, monospace">GoogleAuthController.php</text>
<text x="84" y="358" font-size="12.5" fill="#5a5d66" font-family="ui-monospace, 'DejaVu Sans Mono', 'Cascadia Code', Menlo, monospace">User.php</text>
<text x="84" y="378" font-size="12.5" fill="#5a5d66" font-family="ui-monospace, 'DejaVu Sans Mono', 'Cascadia Code', Menlo, monospace">routes/web.php</text>
<line x1="290.0" y1="422" x2="290.0" y2="440" stroke="#aab0bb" stroke-width="2"/>
<path d="M285.0 435 L295.0 435 L290.0 442 Z" fill="#aab0bb"/>
<rect x="50" y="444" width="480" height="100" rx="9" fill="#ffffff" stroke="#d7d9e0" filter="url(#cardsh)"/>
<text x="70" y="475" font-size="15.5" fill="#1c1d22" font-weight="700">redirect_uri must match Google exactly</text>
<rect x="70" y="486" width="66" height="20" rx="6" fill="#fdeede"/>
<text x="103" y="500" font-size="11" fill="#b5650f" text-anchor="middle" font-weight="700" letter-spacing="0.4">GOTCHA</text>
<text x="70" y="524" font-size="13.5" fill="#6b6e78">Otherwise: 400 invalid_request on the callback.</text>
