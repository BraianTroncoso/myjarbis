<rect x="0" y="0" width="580" height="568" rx="10" fill="#eef0f3"/>
<rect x="50" y="26" width="480" height="46" rx="9" fill="#e0413f" filter="url(#cardsh)"/>
<text x="290.0" y="55.0" font-size="18" fill="#fff" text-anchor="middle" font-weight="700" letter-spacing="0.5">auth</text>
<line x1="290.0" y1="76" x2="290.0" y2="94" stroke="#aab0bb" stroke-width="2"/>
<path d="M285.0 89 L295.0 89 L290.0 96 Z" fill="#aab0bb"/>
